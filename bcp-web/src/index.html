<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comply Solution — Regulatory Compliance Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d7ee6">
  <meta name="description" content="Comply Solution — AI-powered regulatory gap analysis and compliance management">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/comply-solution-mark-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/brand/comply-solution-mark-192.png">
  <script>
    (function () {
      // One-shot wipe of stale demo / dual-verify local caches (keeps theme + workspace).
      var CLEAR_VERSION = '2026-07-08';
      var MARKER = 'reguliq-storage-cleared';
      try {
        if (localStorage.getItem(MARKER) !== CLEAR_VERSION) {
          var keep = { 'reguliq-theme': 1, 'reguliq-workspace': 1 };
          var kill = [
            'reguliq-gap-report',
            'reguliq-gap-drafts',
            'reguliq-documents',
            'bcp-app-dual-verify-report',
            'bcp-app-kafka-dual-verify-recent'
          ];
          for (var i = 0; i < kill.length; i++) localStorage.removeItem(kill[i]);
          var toRemove = [];
          for (var j = 0; j < localStorage.length; j++) {
            var k = localStorage.key(j);
            if (!k || keep[k] || k === MARKER) continue;
            if (k.indexOf('reguliq-') === 0 || k.indexOf('bcp-app-') === 0) toRemove.push(k);
          }
          for (var n = 0; n < toRemove.length; n++) localStorage.removeItem(toRemove[n]);
          try { sessionStorage.clear(); } catch (e) {}
          localStorage.setItem(MARKER, CLEAR_VERSION);
        }
      } catch (e) {}

      var stored = localStorage.getItem('reguliq-theme');
      var theme = stored === 'light' ? 'light' : 'dark';
      if (stored === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
